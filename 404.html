<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Casa Rápida</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/img/logo-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    background: var(--graphite);
    color: var(--cream);
  }
  .notfound__code {
    font-family: 'Poppins', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 10px;
  }
  .notfound h1 { color: var(--cream); font-size: 1.6rem; margin-bottom: 14px; }
  .notfound p { color: rgba(246,242,234,0.7); margin-bottom: 30px; }
</style>
</head>
<body>
  <div class="notfound">
    <div>
      <div class="notfound__code">404</div>
      <h1>Essa página não existe</h1>
      <p>O endereço que você acessou não foi encontrado. Volte para a página inicial da Casa Rápida.</p>
      <a href="/" class="btn btn-primary">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
